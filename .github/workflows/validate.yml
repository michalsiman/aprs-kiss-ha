name: Validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "aprslib>=0.7.2"
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m py_compile bridge/kiss_tcp_bridge.py custom_components/aprs_kiss/*.py
      - run: node --check custom_components/aprs_kiss/frontend/aprs-kiss-panel.js

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
